server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ==================== 优化 HTTP Keep-Alive 连接复用 ====================
    # 启用 Keep-Alive（默认开启，这里显式配置以便调优）
    keepalive_timeout 65s;           # Keep-Alive 超时时间（与后端一致）
    keepalive_requests 1000;         # 单个连接最多处理1000个请求（默认100）
    
    # 上游连接池配置（后端连接复用）
    upstream backend {
        server backend:3000;
        keepalive 32;                # 保持32个空闲连接（连接池大小）
        keepalive_timeout 60s;       # 上游连接超时
        keepalive_requests 1000;     # 单个连接最多处理1000个请求
    }

    # 启用gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;

    # API代理
    location /api {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        
        # 启用 Keep-Alive 连接复用（关键配置）
        proxy_set_header Connection "";  # 清空 Connection 头，启用 Keep-Alive
        
        # WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置
        proxy_connect_timeout 10s;   # 连接超时
        proxy_send_timeout 30s;      # 发送超时
        proxy_read_timeout 30s;      # 读取超时
        
        # 缓冲设置（优化性能）
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # WebSocket代理
    location /socket.io {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket超时设置
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_connect_timeout 10s;
    }

    # SPA路由支持
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
